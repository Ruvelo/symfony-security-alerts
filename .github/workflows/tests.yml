name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # ruvelo/security-advisories isn't on Packagist yet. Remove this step and the
  # repositories line below once it is.
  CORE_REPOSITORY: https://github.com/Ruvelo/security-advisories

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer config repositories.core vcs "$CORE_REPOSITORY"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer config repositories.core vcs "$CORE_REPOSITORY"
          sed -i -E 's#("symfony/[a-z-]+": )"\^6\.4 \|\| \^7\.0"#\1"${{ matrix.symfony }}"#' composer.json
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
